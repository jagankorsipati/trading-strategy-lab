[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-lab"
version = "0.1.0"
description = "A transparent, testable quantitative strategy backtesting lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alpaca-py>=0.42",
  "fastapi>=0.115",
  "numpy>=1.26",
  "pandas>=2.2",
  "pandas-market-calendars>=5.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
